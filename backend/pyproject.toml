[project]
name = "review-catalog-platform"
version = "0.4.0"
description = "Versioned review catalog pipeline and demo API"
requires-python = ">=3.12"
dependencies = [
  "duckdb>=1.3,<2",
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "numpy>=1.26,<2",
  "openai>=1.99,<3",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.10,<3",
  "pytz>=2025.2",
  "pyyaml>=6.0,<7",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
embedding = ["sentence-transformers>=5.1,<6"]
reclustering = [
  "pandas>=2.1.2,<2.2",
  "pyarrow>=14,<25",
  "scikit-learn>=1.4,<2",
]

[dependency-groups]
dev = [
  "pytest>=8.4,<10",
  "pytest-cov>=6.2,<8",
  "ruff>=0.12,<1",
]

[project.scripts]
review-catalog-api = "review_catalog.main:run"
review-catalog-finalize = "review_catalog.services.release:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/review_catalog"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008", "E501"]
